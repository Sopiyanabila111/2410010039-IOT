<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard - REST API + WebSocket</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; }
    h1 { color: white; font-size: 28px; }
    .head-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; transition: box-shadow .3s, outline-color .3s; outline: 3px solid transparent; }
    .card .label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
    .card .unit { font-size: 18px; color: #aaa; }
    .card.alarm { outline-color: #dc3545; }
    .card.alarm .value { color: #dc3545; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .ok { background: #d4edda; color: #155724; }
    .bad { background: #f8d7da; color: #721c24; }
    .wait { background: #fff3cd; color: #856404; }
    .panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px; }
    .panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    .row .panel { margin-bottom: 0; }
    .row { margin-bottom: 25px; }
    .chart-box { position: relative; height: 300px; }
    .controls { display: flex; gap: 15px; flex-wrap: wrap; }
    .btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s; }
    .btn:focus-visible, input:focus-visible { outline: 3px solid #764ba2; outline-offset: 2px; }
    .btn-on { background: #28a745; color: white; } .btn-on:hover { background: #218838; }
    .btn-off { background: #dc3545; color: white; } .btn-off:hover { background: #c82333; }
    .btn-main { background: #667eea; color: white; } .btn-main:hover { background: #5568d3; }
    .btn-ghost { background: rgba(255,255,255,.2); color: white; padding: 8px 16px; font-size: 13px; }
    .btn-ghost:hover { background: rgba(255,255,255,.35); }
    .btn-link { background: none; color: #667eea; padding: 8px 0; font-size: 13px; text-decoration: underline; }
    .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 110px; }
    .field label { font-size: 13px; color: #666; }
    .field input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    .hint { font-size: 13px; color: #888; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f8f9fa; color: #666; text-transform: uppercase; font-size: 12px; }
    tr:hover td { background: #f9f9f9; }
    #log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
    #log .error { color: #f66; } #log .info { color: #6af; } #log .warn { color: #fc6; }
    #toasts { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 50; max-width: 340px; }
    .toast { background: #dc3545; color: white; padding: 14px 18px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.3); font-size: 14px; }
    .toast.info { background: #28a745; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div class="container">
    <header>
      <h1>IoT Dashboard</h1>
      <div class="head-right">
        <span class="badge wait" id="conn-badge">Menghubungkan...</span>
      </div>
    </header>

    <div class="cards">
      <div class="card" id="card-suhu">
        <div class="label">Suhu</div>
        <div class="value" id="suhu">--</div>
        <div class="unit">°C</div>
      </div>
      <div class="card">
        <div class="label">Kelembaban</div>
        <div class="value" id="kelembaban">--</div>
        <div class="unit">%</div>
      </div>
      <div class="card">
        <div class="label">Status Sensor</div>
        <div class="value" style="font-size:22px;"><span class="badge bad" id="status-badge">OFFLINE</span></div>
      </div>
    </div>

    <div class="panel">
      <h2>Grafik Real-time</h2>
      <div class="chart-box"><canvas id="chart" aria-label="Grafik suhu dan kelembaban"></canvas></div>
    </div>

    <div class="row">
      <div class="panel">
        <h2>Kontrol Perangkat</h2>
        <div class="controls">
          <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
          <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
        </div>
      </div>
      <div class="panel">
        <h2>Batas Suhu</h2>
        <div class="controls">
          <div class="field"><label for="th-max">Batas atas (°C)</label><input id="th-max" type="number" step="0.1" placeholder="mis. 30"></div>
          <div class="field"><label for="th-min">Batas bawah (°C)</label><input id="th-min" type="number" step="0.1" placeholder="opsional"></div>
        </div>
        <div class="controls" style="margin-top:12px; align-items:center;">
          <button class="btn btn-main" onclick="saveThreshold()">Simpan batas</button>
          <button class="btn btn-link" onclick="enableNotif()">Aktifkan notifikasi browser</button>
        </div>
        <p class="hint" id="th-info">Batas aktif: -</p>
      </div>
    </div>

    <div class="panel">
      <h2>10 Data Sensor Terakhir</h2>
      <table>
        <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
        <tbody id="history-body">
          <tr><td colspan="3" style="text-align:center;color:#999;">Memuat...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Log Aktivitas</h2>
      <div id="log"></div>
    </div>
  </div>

  <script>
    // ===== Konfigurasi =====
    // Bila dibuka dari Node-RED (/dashboard) pakai origin yang sama (tanpa CORS); bila dari file/Live Server pakai localhost:1880
    const API_HOST = (location.pathname === '/dashboard' || location.pathname === '/dashboard/') ? location.host : 'localhost:1880';
    const API_BASE = `http://${API_HOST}/api`;
    const WS_URL   = `ws://${API_HOST}/ws`;
    const MAX_POINTS = 30;                        // titik pada grafik
    const OFFLINE_AFTER_MS = 10000;               // sensor dianggap offline bila tak ada data

    // ===== State =====
    const API_KEY = 'iot-c953cd03a163f3f8010f838fa2988f0b';   // tertanam, sama dengan key di flows.json (tanpa input manual)
    let series = [];                              // [{received, suhu, kelembaban}]
    let threshold = { max: null, min: null };
    let lastSeen = 0;
    let ws = null, wsTimer = null, pingTimer = null, pollTimer = null, backoff = 1000;

    // ===== Util UI =====
    const $ = id => document.getElementById(id);
    const fmtTime = iso => new Date(iso).toLocaleTimeString('id-ID');

    function log(msg, type = 'info') {
      const el = $('log'), div = document.createElement('div');
      div.className = type;
      div.textContent = `[${new Date().toLocaleTimeString('id-ID')}] ${msg}`;
      el.appendChild(div);
      while (el.children.length > 200) el.removeChild(el.firstChild);
      el.scrollTop = el.scrollHeight;
    }

    function toast(msg, kind = '') {
      const t = document.createElement('div');
      t.className = 'toast ' + kind;
      t.textContent = msg;
      $('toasts').appendChild(t);
      setTimeout(() => t.remove(), 7000);
    }

    function setConn(state) {
      const b = $('conn-badge');
      const map = {
        ws:   ['ok',   'WebSocket: live'],
        off:  ['bad',  'Terputus - mode polling'],
        wait: ['wait', 'Menghubungkan...']
      };
      b.className = 'badge ' + map[state][0];
      b.textContent = map[state][1];
    }

    // ===== Request API =====
    async function api(path, opts = {}) {
      const res = await fetch(API_BASE + path, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY, ...(opts.headers || {}) }
      });
      if (res.status === 401) {
        log('API key ditolak server (401). Import ulang flows.json terbaru lalu Deploy', 'error');
        throw new Error('Unauthorized');
      }
      return res.json();
    }

    // ===== Chart.js =====
    const chart = new Chart($('chart'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Suhu (°C)', data: [], borderColor: '#e8590c', backgroundColor: 'rgba(232,89,12,.1)', fill: true, tension: .3, pointRadius: 2, yAxisID: 'y' },
          { label: 'Kelembaban (%)', data: [], borderColor: '#667eea', tension: .3, pointRadius: 2, yAxisID: 'y1' },
          { label: 'Batas atas', data: [], borderColor: '#dc3545', borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0, yAxisID: 'y' },
          { label: 'Batas bawah', data: [], borderColor: '#0d6efd', borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0, yAxisID: 'y' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom' } },
        scales: {
          y:  { title: { display: true, text: '°C' } },
          y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '%' } }
        }
      }
    });

    function refreshChart() {
      const d = chart.data;
      d.labels = series.map(p => fmtTime(p.received));
      d.datasets[0].data = series.map(p => p.suhu);
      d.datasets[1].data = series.map(p => p.kelembaban);
      d.datasets[2].data = series.map(() => threshold.max);
      d.datasets[3].data = series.map(() => threshold.min);
      chart.update('none');
    }

    // ===== Data sensor =====
    function renderTable() {
      const tbody = $('history-body');
      tbody.replaceChildren();
      if (!series.length) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
        return;
      }
      series.slice(-10).reverse().forEach(p => {
        const tr = document.createElement('tr');
        [fmtTime(p.received), p.suhu, p.kelembaban].forEach(v => {
          const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function checkAlarm(suhu) {
      const high = threshold.max !== null && suhu > threshold.max;
      const low = threshold.min !== null && suhu < threshold.min;
      $('card-suhu').classList.toggle('alarm', high || low);
    }

    function onReading(r) {
      if (!r || r.suhu === null || r.suhu === undefined) return;
      lastSeen = new Date(r.received).getTime();
      $('suhu').textContent = r.suhu;
      $('kelembaban').textContent = r.kelembaban;
      checkAlarm(r.suhu);
      const last = series[series.length - 1];
      if (!last || last.received !== r.received) {
        series.push({ received: r.received, suhu: r.suhu, kelembaban: r.kelembaban });
        if (series.length > MAX_POINTS) series.shift();
        refreshChart(); renderTable();
      }
      updateStatus();
    }

    function updateStatus() {
      const online = lastSeen && (Date.now() - lastSeen) < OFFLINE_AFTER_MS;
      const b = $('status-badge');
      b.textContent = online ? 'ONLINE' : 'OFFLINE';
      b.className = 'badge ' + (online ? 'ok' : 'bad');
    }
    setInterval(updateStatus, 1000);

    async function loadHistory() {
      try {
        const json = await api(`/history?limit=${MAX_POINTS}`);
        series = (json.data || []).map(d => ({ received: d.received, suhu: d.suhu, kelembaban: d.kelembaban }));
        refreshChart(); renderTable();
        const last = series[series.length - 1];
        if (last) onReading(last);
      } catch (err) { log(`Gagal fetch history: ${err.message}`, 'error'); }
    }

    async function fetchSensor() {            // dipakai hanya saat WebSocket putus
      try {
        const json = await api('/suhu');
        if (json.status === 'success' && json.data.suhu !== null) onReading(json.data);
      } catch (err) { log(`Gagal fetch sensor: ${err.message}`, 'error'); }
    }

    // ===== Threshold =====
    function setThreshold(th) {
      threshold = { max: th.max ?? null, min: th.min ?? null };
      if (document.activeElement !== $('th-max')) $('th-max').value = threshold.max ?? '';
      if (document.activeElement !== $('th-min')) $('th-min').value = threshold.min ?? '';
      const parts = [];
      if (threshold.max !== null) parts.push(`atas ${threshold.max}°C`);
      if (threshold.min !== null) parts.push(`bawah ${threshold.min}°C`);
      $('th-info').textContent = 'Batas aktif: ' + (parts.join(', ') || 'tidak ada');
      refreshChart();
      if (series.length) checkAlarm(series[series.length - 1].suhu);
    }

    async function loadThreshold() {
      try { const j = await api('/threshold'); if (j.data) setThreshold(j.data); }
      catch (err) { log(`Gagal ambil batas: ${err.message}`, 'error'); }
    }

    async function saveThreshold() {
      const val = id => { const v = $(id).value.trim(); return v === '' ? null : Number(v); };
      try {
        const json = await api('/threshold', { method: 'PUT', body: JSON.stringify({ max: val('th-max'), min: val('th-min') }) });
        if (json.status === 'success') { setThreshold(json.data); log('Batas suhu disimpan'); toast('Batas suhu disimpan', 'info'); }
        else { log(`Gagal: ${json.message}`, 'error'); toast(json.message); }
      } catch (err) { log(`Error simpan batas: ${err.message}`, 'error'); }
    }

    // ===== Notifikasi =====
    function enableNotif() {
      if (!('Notification' in window)) return toast('Browser tidak mendukung notifikasi');
      Notification.requestPermission().then(p => log(`Izin notifikasi: ${p}`));
    }

    function onAlert(a) {
      log(`ALERT: ${a.message}`, 'error');
      toast(a.message);
      if ('Notification' in window && Notification.permission === 'granted') new Notification('Peringatan suhu', { body: a.message });
    }

    // ===== Kontrol =====
    async function kontrol(device, action) {
      try {
        const json = await api('/kontrol', { method: 'POST', body: JSON.stringify({ device, action }) });
        if (json.status === 'success') log(`Perintah terkirim: ${device} -> ${action}`);
        else log(`Gagal: ${json.message}`, 'error');
      } catch (err) { log(`Error kontrol: ${err.message}`, 'error'); }
    }

    // ===== WebSocket (+ polling cadangan) =====
    function startPolling() { if (!pollTimer) { fetchSensor(); pollTimer = setInterval(fetchSensor, 3000); } }
    function stopPolling() { clearInterval(pollTimer); pollTimer = null; }

    function connectWS() {
      clearTimeout(wsTimer); clearInterval(pingTimer);
      if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
      setConn('wait');
      ws = new WebSocket(WS_URL);
      ws.onopen = () => ws.send(JSON.stringify({ type: 'auth', key: API_KEY }));
      ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } handleWS(m); };
      ws.onerror = () => {};
      ws.onclose = () => {
        clearInterval(pingTimer); setConn('off'); startPolling();
        wsTimer = setTimeout(connectWS, backoff);
        backoff = Math.min(backoff * 2, 15000);
      };
    }

    function handleWS(m) {
      switch (m.type) {
        case 'auth_ok':
          backoff = 1000; setConn('ws'); stopPolling();
          pingTimer = setInterval(() => { if (ws.readyState === 1) ws.send('{"type":"ping"}'); }, 20000);
          log('WebSocket terhubung, update tanpa polling');
          loadHistory(); loadThreshold();
          break;
        case 'auth_fail':
          log('API key ditolak oleh WebSocket. Import ulang flows.json terbaru lalu Deploy', 'error');
          ws.onclose = null; ws.close(); setConn('off');
          break;
        case 'sensor':    onReading(m.data); break;
        case 'alert':     onAlert(m.data); break;
        case 'threshold': setThreshold(m.data); log('Batas suhu diperbarui'); break;
        case 'control':   log(`Perintah ${m.data.device} -> ${m.data.action}`); break;
      }
    }

    function start() { connectWS(); if (!ws || ws.readyState !== 1) { loadHistory(); loadThreshold(); } }

    log('Dashboard dimulai');
    start();
  </script>
</body>
</html>
